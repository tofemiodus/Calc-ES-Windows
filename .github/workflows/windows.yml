name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          dotnet publish .\CalcES.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output .\publish
          New-Item -ItemType Directory -Force -Path .\publish\wwwroot | Out-Null
          foreach ($asset in @('index.html', 'toto.css', 'toto.js', 'logo.svg')) {
            Copy-Item -LiteralPath $asset -Destination .\publish\wwwroot -Force
          }
          foreach ($file in @('install-windows.cmd', 'install-windows.ps1', 'LICENSE', 'README.md', 'TRADEMARKS.md')) {
            Copy-Item -LiteralPath $file -Destination .\publish -Force
          }
          Compress-Archive -Path .\publish\* -DestinationPath .\Calc-ES-Windows-win-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Calc-ES-Windows-win-x64
          path: Calc-ES-Windows-win-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Calc-ES-Windows-win-x64.zip
